<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Calorías</title>
  <meta name="description" content="Registro personal de calorías y nutrientes. Todo se guarda solo en tu dispositivo.">
  <meta name="theme-color" content="#16a34a" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1512" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./css/styles.css">
  <!-- Chart.js (UMD, copia local para que funcione offline). Expone window.Chart -->
  <script src="./vendor/chart.umd.min.js" defer></script>
  <script type="module" src="./js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <h1 id="view-title">Calorías</h1>
    <div class="topbar-actions" id="topbar-actions"></div>
  </header>

  <main id="view" class="view" aria-live="polite">
    <p class="loading">Cargando…</p>
  </main>

  <!-- Botón flotante de escaneo (visible solo en "Hoy") -->
  <button id="fab-scan" class="fab" aria-label="Escanear código de barras" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7V4a1 1 0 0 1 1-1h3M17 3h3a1 1 0 0 1 1 1v3M21 17v3a1 1 0 0 1-1 1h-3M7 21H4a1 1 0 0 1-1-1v-3M7 8v8M10 8v8M13 8v8M16 8v8"/></svg>
  </button>

  <nav class="bottomnav" aria-label="Secciones">
    <a href="#/hoy" data-route="hoy">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg><span>Hoy</span></a>
    <a href="#/buscar" data-route="buscar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><span>Alimentos</span></a>
    <a href="#/graficas" data-route="graficas">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Gráficas</span></a>
    <a href="#/peso" data-route="peso">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M8 10a4 4 0 0 1 8 0M12 10l2-2"/></svg><span>Peso</span></a>
    <a href="#/perfil" data-route="perfil">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span>Perfil</span></a>
  </nav>

  <!-- Contenedor de diálogos (hojas inferiores) -->
  <div id="dialogs"></div>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
